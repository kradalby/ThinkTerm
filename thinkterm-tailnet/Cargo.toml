[package]
name = "thinkterm-tailnet"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# The node itself, for the one process that holds it: `thinkterm-tailnet`
# (thinkterm-tailnet-node). Without it this crate reads and changes the
# settings, reads the node's reports, asks for connections through it, and
# keeps it running -- all the app, `thinkterm` and the mux server need,
# without the library in them.
node = ["dep:tailscale", "dep:tokio", "dep:ts_control"]

[dependencies]
anyhow.workspace = true
config.workspace = true
log.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
socket2.workspace = true
thinkterm-core.workspace = true
url.workspace = true
# Only for the dialer a process registers with it (see use_for_ssh).
wezterm-ssh.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "user"] }

# The library runs on macOS and Linux only; elsewhere this crate builds
# without it and SUPPORTED says so.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
http_req.workspace = true
tailscale = { version = "0.6.1", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
ts_control = { version = "0.6.1", optional = true }

[dev-dependencies]
tempfile.workspace = true
